name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: make install

      - name: Lint
        run: make lint

      - name: Format
        run: make format-check

      - name: Typecheck
        run: make typecheck

      - name: Coverage
        run: make coverage
